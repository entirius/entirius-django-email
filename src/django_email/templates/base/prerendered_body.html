{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="x-apple-disable-message-reformatting"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta http-equiv="Content-Type" content="text/html charset=UTF-8"/>
    <title>{{ subject }}</title>
    <style type="text/css">
      .content-area p {
        margin: 0;
      }
    </style>
</head>
<body style="margin: 0; padding: 0; width: 100%; background-color: {{main_bgc}};">

  <table width="100%" height="100%" border="0" cellspacing="0" cellpadding="0" role="presentation" bgcolor="{{main_bgc}}">
    <tr>
      <td align="center" valign="top">

        {% include 'base/header.html' %}

        <table width="100%" border="0" cellspacing="0" cellpadding="0" role="presentation" style="max-width: 600px;">
          <tr>
            <td class="content-area" bgcolor="{{body_bgc}}" style="background-color: {{body_bgc}};">
              {# Body is pre-rendered AND pre-sanitized by the caller — |safe is safe-by-construction here. #}
              {{ prerendered_body|safe }}
            </td>
          </tr>
        </table>

        {% include 'base/footer.html' %}
        </td>
    </tr>
  </table>
</body>
</html>
