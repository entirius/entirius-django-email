[project]
name = "entirius-django-email"
version = "4.0.0"
description = "Transactional email Django module for Volkanos — branded templates per channel and language"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=4.0.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.0",
    "drf-spectacular>=0.27",
    "pydantic>=2.0",
    "entirius-django-utils>=2.0.0",
    "entirius-django-regional>=2.0.0",
    "entirius-py-process-logger>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "factory-boy"]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-email"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_email"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106"]
# Legacy migrated 1:1 (DJ001 = schema contract, not touched)
"src/django_email/models/**" = ["DJ001", "DJ012"]
"src/django_email/services/channel_service.py" = ["B904"]

[tool.ruff.lint.isort]
known-first-party = ["django_email"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
